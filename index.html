<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Drift</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Gravity Drift</h1>
      <p class="tagline">One button. Flip gravity. Don't crash.</p>
    </header>

    <canvas id="game" width="800" height="400"></canvas>

    <section class="controls">
      <div><kbd>Space</kbd> or <kbd>Click</kbd> to flip</div>
      <div><kbd>P</kbd> pause</div>
      <div><kbd>M</kbd> mute</div>
      <div><kbd>R</kbd> restart </div>
    </section>

    <footer>
      Made by Navilesh with HTML, CSS and JavaScript Canvas.
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
